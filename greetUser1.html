<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Hello, <span id="name">User</span></h1>

<ul>
    <li>Kwame</li>
    <li>Kofi</li>
</ul>

<script >
    // prompt a user for name
    var name = prompt("What is your name?");
    // replaces user name entered in prompt 
    document.getElementById("name").innerHTML = name
    // adds color to user name entered in prompt
    document.getElementById("name").style.color = "red"
    // changes the default font family of the user name entered in prompt
    document.getElementById("name").style.fontFamily = "cursive";
</script>
</body>
</html>
